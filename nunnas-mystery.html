<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nunnas Mystery Files</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#2d3561;--navy2:#3d4878;
  --teal:#00cec9;--teal2:#00b5b0;--tealp:#e0fafa;
  --purple:#a29bfe;--purplep:#eeeeff;--purpled:#6c5ce7;
  --green:#00b894;--greenp:#e6faf5;--greend:#007a63;
  --coral:#e17055;--coralp:#fff0ed;--corald:#a84f20;
  --amber:#f9a825;--amberp:#fff8e6;--nearlyd:#b57a00;
  --red:#d63031;--redp:#fff0f0;
  --text:#2d2d2d;--muted:#6b7280;
  --border:#e5e7f0;--bg:#f5f6ff;--rad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 50%,#4a5490 100%);padding:2.5rem 1.25rem 5rem;position:relative;overflow:hidden;text-align:center}
.hc1{position:absolute;width:340px;height:340px;border-radius:50%;background:var(--teal);opacity:.12;filter:blur(60px);top:-80px;left:-60px;pointer-events:none}
.hc2{position:absolute;width:280px;height:280px;border-radius:50%;background:var(--purple);opacity:.15;filter:blur(60px);bottom:-60px;right:-40px;pointer-events:none}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:white;border-radius:12px;padding:8px 20px;font-family:'Lora',serif;font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:1rem;position:relative;z-index:2}
.hero h1{font-family:'Lora',serif;font-size:clamp(1.7rem,5vw,2.5rem);font-weight:700;color:white;position:relative;z-index:2;line-height:1.2;margin-bottom:.4rem}
.hero h1 em{color:var(--teal);font-style:italic}
.hero p{color:rgba(255,255,255,.75);font-size:.95rem;position:relative;z-index:2}

/* ── WRAP ── */
.wrap{max-width:760px;margin:-2.5rem auto 0;padding:0 1.25rem 4rem;position:relative;z-index:10}

/* ── TEACHER DARK PANELS ── */
.tpanel{background:#1e2340;border-radius:var(--rad);border:2px solid #3d4878;box-shadow:0 4px 24px rgba(0,0,0,.3);margin-bottom:1.25rem;overflow:hidden}
.tphdr{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.5rem;cursor:pointer;user-select:none}
.tphdr h2{font-size:1rem;font-weight:800;color:white;display:flex;align-items:center;gap:.5rem}
.tti{font-size:1.2rem;color:rgba(255,255,255,.4);transition:transform .25s;display:inline-block}
.tpbody{display:none;padding:1.25rem 1.5rem;border-top:2px solid #3d4878}
.tpbody.open{display:block}
.topen .tti{transform:rotate(180deg)}

/* ── SBOX ── */
.sbox{background:#161930;border-radius:10px;padding:1.1rem;margin-bottom:.9rem}
.sbox-lbl{color:var(--teal);font-size:.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem}
.url-row{display:flex;gap:.5rem}
.url-row input{flex:1;padding:10px 14px;border-radius:8px;border:2px solid #3d4878;background:#2d3561;color:white;font-family:'Nunito',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s}
.url-row input:focus{border-color:var(--teal)}
.url-row input::placeholder{color:rgba(255,255,255,.28)}
.tbtn{padding:10px 18px;border-radius:8px;border:none;background:var(--teal);color:#1e2340;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:.85rem;white-space:nowrap;transition:background .15s}
.tbtn:hover{background:var(--teal2)}
.sstat{font-size:.82rem;margin-top:.45rem;color:rgba(255,255,255,.4);min-height:1.1em}
.sstat.ok{color:var(--teal)}.sstat.err{color:var(--coral)}

/* ── STEPS ── */
.tsteps{margin-bottom:1rem}
.tstep{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.55rem}
.tsn{width:22px;height:22px;border-radius:50%;background:#3d4878;color:var(--teal);font-weight:900;font-size:.72rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.tst{font-size:.83rem;color:rgba(255,255,255,.65);line-height:1.55}
code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px;font-size:.78rem;color:var(--teal);font-weight:700}

/* ── CASE ROWS ── */
.case-entry{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.case-entry input{flex:1;padding:9px 13px;border-radius:8px;border:2px solid #3d4878;background:#2d3561;color:white;font-family:'Nunito',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s}
.case-entry input:focus{border-color:var(--teal)}
.case-entry input::placeholder{color:rgba(255,255,255,.28)}
.case-lbl{color:rgba(255,255,255,.55);font-size:.8rem;font-weight:700;min-width:52px}
.rm-btn{background:rgba(220,60,60,.2);color:#fca5a5;border:none;border-radius:7px;padding:7px 10px;font-size:.82rem;cursor:pointer;transition:background .15s}
.rm-btn:hover{background:rgba(220,60,60,.4)}
.add-btn{width:100%;padding:9px;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.2);border-radius:8px;color:rgba(255,255,255,.55);font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:.2rem;transition:all .15s}
.add-btn:hover{background:rgba(255,255,255,.12);color:white}

/* ── PREVIEW CHIPS ── */
.chip-area{display:none;margin-top:.9rem}
.chip-lbl{color:var(--teal);font-size:.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem}
.chip-row{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:#2d3561;border:1px solid #3d4878;border-radius:10px;padding:.45rem .85rem;font-size:.8rem;color:rgba(255,255,255,.8);font-weight:700;display:flex;align-items:center;gap:.4rem}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* ── REDIS SECTION ── */
.redis-note{font-size:.8rem;color:rgba(255,255,255,.45);line-height:1.55;margin-bottom:.8rem}

/* ── GENERATE ── */
.gen-wrap{margin-top:1rem}
.gen-lbl{color:var(--teal);font-size:.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem}
.btn-gen{padding:10px 22px;border-radius:8px;border:none;background:var(--teal);color:#1e2340;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:.9rem;transition:background .15s;margin-bottom:.75rem}
.btn-gen:hover{background:var(--teal2)}
.gen-area{width:100%;padding:10px;border-radius:8px;border:2px solid #3d4878;background:#2d3561;color:white;font-family:monospace;font-size:.75rem;resize:none;line-height:1.5}
.copy-btn{margin-top:.4rem;padding:8px 18px;border-radius:8px;border:none;background:var(--green);color:white;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:.82rem;transition:background .15s;display:none}
.copy-btn:hover{background:var(--greend)}
.copy-ok{color:var(--teal);font-size:.8rem;margin-top:.35rem;display:none;font-weight:700}

/* ── SHEET TEMPLATE TABLE ── */
.sheet-tbl{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:.7rem;overflow-x:auto;display:block}
.sheet-tbl th{background:#2d3561;color:var(--teal);padding:6px 9px;text-align:left;white-space:nowrap;font-weight:800}
.sheet-tbl td{padding:5px 9px;border-bottom:1px solid #3d4878;color:rgba(255,255,255,.65);white-space:nowrap}
.sheet-tbl tr:nth-child(even) td{background:rgba(255,255,255,.03)}

/* ── PROGRESS LOG ── */
.log-panel{margin-top:1.25rem}
.log-entry{display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;border-radius:10px;border:1.5px solid var(--border);margin-bottom:.5rem;background:white}
.log-rank{min-width:30px;font-weight:900;color:var(--muted);font-size:.9rem}
.log-name{flex:1;font-weight:700;font-size:.9rem}
.log-pills{display:flex;flex-wrap:wrap;gap:.3rem}
.lpill{padding:.18rem .55rem;border-radius:10px;font-size:.72rem;font-weight:800}
.ep-good{background:var(--greenp);color:var(--greend);border:1.5px solid var(--green)}
.ep-nearly_good{background:var(--amberp);color:var(--nearlyd);border:1.5px solid var(--amber)}
.ep-nearly_funny{background:var(--purplep);color:var(--purpled);border:1.5px solid var(--purple)}
.ep-bad_funny{background:var(--coralp);color:var(--corald);border:1.5px solid var(--coral)}
.ep-bad{background:var(--redp);color:var(--red);border:1.5px solid var(--red)}

/* ═══════════════════════════════
   STUDENT GAME STYLES
═══════════════════════════════ */
.card{background:white;border-radius:var(--rad);border:2px solid var(--border);box-shadow:0 4px 24px rgba(45,53,97,.10);margin-bottom:1.25rem;overflow:hidden}

/* name screen */
.name-screen{padding:2.2rem 1.5rem;text-align:center}
.name-screen h2{font-family:'Lora',serif;font-size:1.5rem;color:var(--navy);margin-bottom:.35rem}
.name-screen p{color:var(--muted);font-size:.9rem;margin-bottom:1.3rem}
.name-row{display:flex;gap:.5rem;max-width:380px;margin:0 auto}
.name-row input{flex:1;padding:.7rem 1rem;border:2px solid var(--border);border-radius:10px;font-family:'Nunito',sans-serif;font-size:1rem;color:var(--text);outline:none;transition:border-color .2s}
.name-row input:focus{border-color:var(--purpled)}
.btn{padding:.7rem 1.4rem;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.92rem;cursor:pointer;transition:all .18s}
.btn-navy{background:var(--navy);color:white}.btn-navy:hover{background:var(--navy2);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border)}.btn-ghost:hover{border-color:var(--purple);color:var(--purpled)}

/* past endings */
.past-row{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.8rem}
.ep{padding:.28rem .75rem;border-radius:14px;font-size:.78rem;font-weight:800}

/* case select */
.case-grid{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));padding:1.25rem}
.case-card{border:2px solid var(--border);border-radius:12px;padding:1.15rem 1rem;cursor:pointer;transition:all .2s;background:var(--bg);text-align:center}
.case-card:hover{border-color:var(--teal);background:var(--tealp);transform:translateY(-2px)}
.case-card.solved{border-color:var(--green);background:var(--greenp)}
.cicon{font-size:2.1rem;margin-bottom:.4rem}
.ctitle{font-family:'Lora',serif;font-weight:700;font-size:.97rem;color:var(--navy);margin-bottom:.3rem}
.clevel{display:inline-block;padding:.18rem .65rem;border-radius:14px;font-size:.73rem;font-weight:800}
.csolve{font-size:.75rem;color:var(--greend);font-weight:700;margin-top:.3rem}

/* game screen */
#gameWrap{padding:1.25rem}
.path-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;flex-wrap:wrap;gap:.4rem}
.pbadge{padding:.3rem .85rem;border-radius:14px;font-size:.8rem;font-weight:800}
.pb-good{background:var(--greenp);color:var(--greend);border:1.5px solid var(--green)}
.pb-nearly{background:var(--amberp);color:var(--nearlyd);border:1.5px solid var(--amber)}
.pb-bad{background:var(--redp);color:var(--red);border:1.5px solid var(--red)}
.pb-bad_funny{background:var(--coralp);color:var(--corald);border:1.5px solid var(--coral)}
.pgcount{font-size:.83rem;color:var(--muted);font-weight:700}
.pb-wrap{height:7px;background:var(--border);border-radius:4px;margin-bottom:1.1rem;overflow:hidden}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--purpled));border-radius:4px;transition:width .5s ease;width:0%}

.story-lbl{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal2);margin-bottom:.5rem}
.story-box{background:linear-gradient(135deg,#fafbff,var(--purplep));border:2px solid var(--border);border-radius:14px;padding:1.35rem 1.35rem 1.35rem 1.5rem;margin-bottom:1.1rem;font-family:'Lora',serif;font-size:1.04rem;line-height:1.78;color:var(--text);position:relative;min-height:80px}
.story-box::before{content:'📖';position:absolute;top:-13px;left:14px;font-size:1.3rem;background:white;padding:0 5px;border-radius:7px;border:2px solid var(--border)}

.fb{border-radius:11px;padding:.85rem 1.1rem;margin-bottom:.9rem;font-size:.88rem;line-height:1.55;display:none}
.fb.show{display:block}
.fb-ok{background:var(--greenp);border:2px solid var(--green);color:var(--greend)}
.fb-nearly{background:var(--amberp);border:2px solid var(--amber);color:var(--nearlyd)}
.fb-bad{background:var(--redp);border:2px solid var(--red);color:var(--red)}

.choices{display:grid;gap:.65rem;margin-bottom:.9rem}
.cbtn{display:flex;align-items:flex-start;gap:.75rem;background:white;border:2px solid var(--border);border-radius:12px;padding:.85rem 1rem;cursor:pointer;text-align:left;font-family:'Nunito',sans-serif;font-size:.92rem;color:var(--text);font-weight:600;transition:all .18s;width:100%}
.cbtn:hover:not(:disabled){border-color:var(--purple);background:var(--purplep);transform:translateY(-1px)}
.cbtn:disabled{cursor:not-allowed}
.clbl{min-width:24px;height:24px;border-radius:50%;background:var(--navy);color:white;font-size:.77rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ctxt{flex:1;line-height:1.5}
.cbtn.c-ok{border-color:var(--green)!important;background:var(--greenp)!important}.cbtn.c-ok .clbl{background:var(--green)}
.cbtn.c-nearly{border-color:var(--amber)!important;background:var(--amberp)!important}.cbtn.c-nearly .clbl{background:var(--amber);color:var(--navy)}
.cbtn.c-bad{border-color:var(--coral)!important;background:var(--coralp)!important}.cbtn.c-bad .clbl{background:var(--coral)}

/* ending */
#endWrap{padding:1.75rem 1.5rem;text-align:center;display:none}
.end-icon{font-size:3.8rem;display:block;margin-bottom:.7rem}
.end-title{font-family:'Lora',serif;font-style:italic;font-size:1.75rem;color:var(--navy);margin-bottom:.4rem}
.end-badge{display:inline-block;padding:.45rem 1.3rem;border-radius:16px;font-weight:800;font-size:.9rem;margin-bottom:.9rem}
.end-msg{color:var(--muted);font-size:.9rem;line-height:1.65;max-width:460px;margin:0 auto 1.3rem}
.end-story{font-family:'Lora',serif;font-size:.95rem;color:var(--text);line-height:1.75;border-left:3px solid var(--teal);padding-left:1rem;margin-bottom:1.1rem;text-align:left;max-width:520px;margin-left:auto;margin-right:auto}
.end-acts{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.nearly-note{background:var(--amberp);border:1.5px solid var(--amber);color:var(--nearlyd);border-radius:10px;padding:.5rem 1.1rem;font-size:.84rem;font-weight:700;display:inline-block;margin-bottom:.9rem}

/* load box */
.load-box{text-align:center;padding:3rem 1.25rem}
.spinner{font-size:2.4rem;animation:spin 1.1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.load-box p{color:var(--muted);margin-top:.7rem;font-size:.88rem}

/* no data */
.no-data{text-align:center;padding:2.8rem 1.25rem}
.no-data .ni{font-size:2.5rem;margin-bottom:.7rem}
.no-data h2{font-family:'Lora',serif;color:var(--navy);margin-bottom:.35rem}
.no-data p{color:var(--muted);font-size:.88rem;line-height:1.6}

/* toast */
.toast{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--navy);color:white;border-radius:11px;padding:.7rem 1.25rem;font-size:.86rem;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:999;transform:translateY(16px);opacity:0;transition:all .28s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:480px){
  .hero h1{font-size:1.55rem}
  .name-row{flex-direction:column}
  .end-acts{flex-direction:column}
  .url-row{flex-direction:column}
  .case-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hc1"></div><div class="hc2"></div>
  <div class="logo-badge">🔍 Nunnas Mystery Files</div>
  <h1 id="heroTitle">Teacher <em>Platform</em></h1>
  <p id="heroSub">Set up your case sheets and generate the student link</p>
</div>

<div class="wrap" id="mainWrap"></div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function ge(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gp(k){return new URLSearchParams(window.location.search).get(k)}
function toast(msg,d){
  var t=ge('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d||2600);
}
function togTP(id,tiId){
  var b=ge(id+'_body'),ti=ge(tiId);
  var o=b.classList.toggle('open');
  ti.style.transform=o?'rotate(180deg)':'';
}

// ═══════════════════════════════════════════════
// CSV PARSING
// ═══════════════════════════════════════════════
function splitCSV(line){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){res.push(cur);cur='';}else{cur+=c;}
  }
  res.push(cur);return res;
}
function parseCSVRows(text){
  var lines=text.trim().split(/\r?\n/);
  if(lines.length<2)return[];
  var headers=splitCSV(lines[0]).map(h=>h.trim().toLowerCase().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    var cols=splitCSV(line);
    var obj={};
    headers.forEach((h,i)=>obj[h]=(cols[i]||'').trim().replace(/^"|"$/g,''));
    return obj;
  }).filter(r=>r.page_id||r.name);
}
function fetchCSV(url){
  return fetch(url)
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(text=>parseCSVRows(text));
}

// ═══════════════════════════════════════════════
// INIT — teacher by default, student if ?play=
// ═══════════════════════════════════════════════
window.addEventListener('DOMContentLoaded',function(){
  var play=gp('play');
  if(play){
    ge('heroTitle').innerHTML='Can You Crack the <em>Case?</em>';
    ge('heroSub').textContent='A British English reading adventure';
    renderStudent(play);
  } else {
    renderTeacher();
  }
});

// ════════════════════════════════════════════════════════════
//
//  TEACHER PLATFORM
//
// ════════════════════════════════════════════════════════════
var _caseCount=0;

function renderTeacher(){
  ge('mainWrap').innerHTML=`

    <!-- CASE SHEETS PANEL -->
    <div class="tpanel">
      <div class="tphdr" onclick="togTP('cs','cs_ti')">
        <h2>📋 Step 1 — Add Your Case Sheets</h2>
        <span class="tti" id="cs_ti" style="transform:rotate(180deg)">▾</span>
      </div>
      <div class="tpbody open" id="cs_body">

        <div class="tsteps">
          <div class="tstep"><div class="tsn">1</div><div class="tst">In Google Sheets, create a sheet with these exact column headers:<br>
            <code>page_id</code> <code>path_type</code> <code>story_text</code> <code>choice_a</code> <code>choice_b</code> <code>choice_c</code> <code>cefr</code> <code>case_name</code></div></div>
          <div class="tstep"><div class="tsn">2</div><div class="tst">Use these values for <code>path_type</code>: <code>good</code> <code>nearly</code> <code>bad_funny</code> <code>bad_plain</code> <code>ending_good</code> <code>ending_nearly_good</code> <code>ending_nearly_funny</code> <code>ending_bad_funny</code> <code>ending_bad</code></div></div>
          <div class="tstep"><div class="tsn">3</div><div class="tst">Go to <strong style="color:white">File → Share → Publish to web</strong> → choose your sheet tab → select <strong style="color:white">CSV</strong> → click Publish → copy the URL</div></div>
          <div class="tstep"><div class="tsn">4</div><div class="tst">Paste the URL below. Add one row per case. Click <strong style="color:white">Test</strong> to check it loads.</div></div>
        </div>

        <a href="#" onclick="toggleSheetTemplate(event)" style="font-size:.8rem;color:var(--teal);font-weight:700;display:inline-block;margin-bottom:.7rem">📊 Show column template ▾</a>
        <div id="sheetTpl" style="display:none;overflow-x:auto;margin-bottom:.9rem">
          <table class="sheet-tbl">
            <thead><tr><th>page_id</th><th>path_type</th><th>story_text</th><th>choice_a</th><th>choice_b</th><th>choice_c</th><th>cefr</th><th>case_name</th></tr></thead>
            <tbody>

// ── CASE ENTRIES ──────────────────────────
function addCaseEntry(val){
  _caseCount++;
  var id='ce_'+_caseCount;
  var div=document.createElement('div');
  div.className='case-entry';
  div.id=id;
  div.innerHTML=`
    <span class="case-lbl">Case ${_caseCount}</span>
    <input type="text" placeholder="Paste published CSV URL…" value="${esc(val||'')}"/>
    <button class="tbtn" style="padding:8px 12px;font-size:.78rem" onclick="testCaseEntry('${id}')">Test</button>
    <button class="rm-btn" onclick="ge('${id}').remove()">✕</button>
  `;
  ge('caseEntries').appendChild(div);
}

function testCaseEntry(id){
  var row=ge(id);
  var url=row.querySelector('input').value.trim();
  var btn=row.querySelector('.tbtn');
  if(!url){toast('Paste a URL first.');return;}
  btn.textContent='…';
  fetchCSV(url).then(rows=>{
    var caseName=rows.find(r=>r.case_name)?.case_name||'Unknown';
    var cefr=rows.find(r=>r.cefr)?.cefr||'?';
    btn.textContent='✓';btn.style.background='var(--green)';
    ge('casesStat').textContent='✅ Loaded '+rows.length+' rows — "'+caseName+'" ('+cefr+')';
    ge('casesStat').className='sstat ok';
    addChip(caseName,cefr);
  }).catch(e=>{
    btn.textContent='✗';btn.style.background='var(--coral)';
    ge('casesStat').textContent='❌ '+e.message;
    ge('casesStat').className='sstat err';
  });
}

function addChip(name,cefr){
  ge('chipArea').style.display='block';
  var colours={A1:'#00b894',A2:'#0984e3',B1:'#6c5ce7',B2:'#e17055',C1:'#d63031'};
  var c=colours[cefr]||'#6c5ce7';
  var span=document.createElement('span');
  span.className='chip';
  span.innerHTML=`<span class="dot" style="background:${c}"></span>${esc(name)} <span style="opacity:.55">${esc(cefr)}</span>`;
  ge('chipRow').appendChild(span);
}

function toggleSheetTemplate(e){
  e.preventDefault();
  var t=ge('sheetTpl');
  t.style.display=t.style.display==='none'?'block':'none';
}

// ── REDIS TEST ────────────────────────────
function testRedis(){
  var url=ge('redisUrl').value.trim();
  var tok=ge('redisToken').value.trim();
  if(!url||!tok){toast('Enter both URL and Token first.');return;}
  var stat=ge('redisStat');
  stat.className='sstat';stat.textContent='Testing…';
  fetch(url+'/ping',{headers:{'Authorization':'Bearer '+tok}})
    .then(r=>r.json()).then(d=>{
      if(d.result==='PONG'){
        stat.className='sstat ok';stat.textContent='✅ Connected successfully!';
        localStorage.setItem('nunnas_ru',url);
        localStorage.setItem('nunnas_rt',tok);
      } else {
        stat.className='sstat err';stat.textContent='⚠️ Unexpected response: '+JSON.stringify(d);
      }
    }).catch(e=>{
      stat.className='sstat err';stat.textContent='❌ Failed: '+e.message;
    });
}

// ── GENERATE LINK ─────────────────────────
function getCaseURLs(){
  var urls=[];
  document.querySelectorAll('#caseEntries .case-entry input').forEach(inp=>{
    var v=inp.value.trim();if(v)urls.push(v);
  });
  return urls;
}

function generateLink(){
  var urls=getCaseURLs();
  if(!urls.length){toast('Add at least one case URL first.');return;}
  var ru=ge('redisUrl').value.trim();
  var rt=ge('redisToken').value.trim();
  var base=window.location.href.split('?')[0];
  var payload={sheets:urls};
  if(ru)payload.ru=ru;
  if(rt)payload.rt=rt;
  var encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  var link=base+'?play='+encoded;
  ge('genWrap').style.display='block';
  ge('genOut').value=link;
  ge('copyBtn').style.display='inline-block';
  ge('genWrap').scrollIntoView({behavior:'smooth',block:'center'});
}

function copyLink(){
  var ta=ge('genOut');ta.select();ta.setSelectionRange(0,99999);
  navigator.clipboard.writeText(ta.value).then(()=>{
    ge('copyOk').style.display='block';
    setTimeout(()=>ge('copyOk').style.display='none',2500);
  }).catch(()=>{document.execCommand('copy');});
}

// ── PROGRESS LOG ──────────────────────────
function loadProgressLog(){
  var ru=ge('redisUrl').value.trim()||localStorage.getItem('nunnas_ru')||'';
  var rt=ge('redisToken').value.trim()||localStorage.getItem('nunnas_rt')||'';
  if(!ru||!rt){
    ge('logArea').innerHTML='<p style="color:var(--coral);font-size:.84rem">⚠️ Enter your Redis credentials in Step 2 first.</p>';
    return;
  }
  ge('logArea').innerHTML='<p style="color:rgba(255,255,255,.4);font-size:.84rem">Loading…</p>';
  fetch(ru+'/keys/nunnas:*',{headers:{'Authorization':'Bearer '+rt}})
    .then(r=>r.json()).then(d=>{
      var keys=d.result||[];
      if(!keys.length){ge('logArea').innerHTML='<p style="color:rgba(255,255,255,.4);font-size:.84rem">No student data yet.</p>';return;}
      Promise.all(keys.map(k=>
        fetch(ru+'/get/'+encodeURIComponent(k),{headers:{'Authorization':'Bearer '+rt}})
          .then(r=>r.json()).then(d2=>{
            var name=k.replace('nunnas:','').replace(/_/g,' ');
            var endings=[];try{endings=JSON.parse(d2.result)||[];}catch(e){}
            return {name,endings};
          })
      )).then(students=>{
        students.sort((a,b)=>b.endings.length-a.endings.length);
        var epMeta={
          good:{lbl:'Good',cls:'ep-good',icon:'🏆'},
          nearly_good:{lbl:'Nearly Good',cls:'ep-nearly_good',icon:'🥈'},
          nearly_funny:{lbl:'Nearly Funny',cls:'ep-nearly_funny',icon:'🤡'},
          bad_funny:{lbl:'Bad Funny',cls:'ep-bad_funny',icon:'🎭'},
          bad:{lbl:'Bad',cls:'ep-bad',icon:'💀'}
        };
        var ranks=['🥇','🥈','🥉'];
        var html=students.map((s,i)=>{
          var pills=s.endings.map(e=>{
            var m=epMeta[e.ending]||{lbl:e.ending,cls:'ep-good',icon:'❓'};
            return `<span class="lpill ${m.cls}" title="${esc(e.case)} — ${esc(e.date)}">${m.icon} ${esc(m.lbl)}</span>`;
          }).join('');
          return `<div class="log-entry">
            <div class="log-rank">${ranks[i]||('#'+(i+1))}</div>
            <div class="log-name">${esc(s.name)}</div>
            <div class="log-pills">${pills||'<span style="color:var(--muted);font-size:.8rem">No endings yet</span>'}</div>
          </div>`;
        }).join('');
        ge('logArea').innerHTML=html;
      });
    }).catch(()=>{
      ge('logArea').innerHTML='<p style="color:var(--coral);font-size:.84rem">❌ Could not connect to Redis.</p>';
    });
}

var G={
  studentName:'',
  allCases:[],
  currentCase:null,
  pageId:'',
  nearlyCount:0,
  funnyCount:0,
  badChoices:[],
  history:[],
  redisUrl:'',
  redisToken:''
};

function renderStudent(encoded){
  var config={};
  try{config=JSON.parse(decodeURIComponent(escape(atob(encoded))));}catch(e){}
  var sheets=config.sheets||[];
  G.redisUrl=config.ru||localStorage.getItem('nunnas_ru')||'';
  G.redisToken=config.rt||localStorage.getItem('nunnas_rt')||'';

  if(!sheets.length){
    ge('mainWrap').innerHTML=`<div class="card"><div class="no-data"><div class="ni">🔗</div><h2>No cases found</h2><p>Please use the link provided by your teacher.</p></div></div>`;
    return;
  }

  ge('mainWrap').innerHTML=`<div class="card" id="loadCard"><div class="load-box"><div class="spinner">🔍</div><p id="loadMsg">Loading case files…</p></div></div>`;

  Promise.all(sheets.map(url=>
    fetchCSV(url).then(rows=>{
      if(!rows.length)return null;
      var pages={};
      rows.forEach(r=>{if(r.page_id)pages[r.page_id]=r;});
      var first=rows.find(r=>r.case_name)||{};
      return {name:first.case_name||'Mystery Case',cefr:first.cefr||'B1',pages};
    }).catch(()=>null)
  )).then(cases=>{
    G.allCases=cases.filter(Boolean);
    ge('mainWrap').innerHTML='';
    if(!G.allCases.length){
      ge('mainWrap').innerHTML=`<div class="card"><div class="no-data"><div class="ni">⚠️</div><h2>Couldn't load cases</h2><p>Check that your Google Sheet is published as CSV and the URL is correct.</p></div></div>`;
      return;
    }
    showNameScreen();
  });
}

function loadPastEndings(name,goToCases){

    if(goToCases)showCaseSelect([]);

  var key='nunnas:'+name.toLowerCase().replace(/\s+/g,'_');
  fetch(G.redisUrl+'/get/'+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+G.redisToken}})
    .then(r=>r.json()).then(d=>{
      var endings=[];try{endings=JSON.parse(d.result)||[];}catch(e){}
      if(!goToCases&&ge('pastBox')){
        if(endings.length){
          var epMeta={good:{lbl:'Good',cls:'ep-good ep',icon:'🏆'},nearly_good:{lbl:'Nearly Good',cls:'ep-nearly_good ep',icon:'🥈'},nearly_funny:{lbl:'Nearly Funny',cls:'ep-nearly_funny ep',icon:'🤡'},bad_funny:{lbl:'Bad Funny',cls:'ep-bad_funny ep',icon:'🎭'},bad:{lbl:'Bad',cls:'ep-bad ep',icon:'💀'}};
          ge('pastBox').innerHTML='<p style="font-size:.8rem;color:var(--muted);margin:1rem 0 .4rem">Your previous endings:</p><div class="past-row">'+
            endings.slice(-8).map(e=>{var m=epMeta[e.ending]||{lbl:e.ending,cls:'ep',icon:'❓'};return`<span class="${m.cls}" style="background:var(--purplep);color:var(--purpled);border:1.5px solid var(--purple)">${m.icon} ${esc(e.case)}</span>`;}).join('')+
            '</div>';

      if(goToCases)showCaseSelect(endings);
    }).catch(()=>{if(goToCases)showCaseSelect([]);});

// ── CASE SELECT ───────────────────────────
function showCaseSelect(endings){
  var cefrC={A1:{bg:'var(--greenp)',fg:'var(--greend)',bd:'var(--green)'},A2:{bg:'#e8f4fd',fg:'#065a9e',bd:'#0984e3'},B1:{bg:'var(--purplep)',fg:'var(--purpled)',bd:'var(--purpled)'},B2:{bg:'var(--coralp)',fg:'var(--corald)',bd:'var(--coral)'},C1:{bg:'var(--redp)',fg:'var(--red)',bd:'var(--red)'}};
  var icons=['🔍','🗝️','🕯️','📜','🧩','🔭','🗺️','💎','⚗️','🧲'];
  var html=`<div style="padding:1.1rem 1.25rem .5rem"><div style="font-family:'Lora',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:.25rem">🗂️ Choose Your Case</div><p style="font-size:.87rem;color:var(--muted)">Hello, <strong>${esc(G.studentName)}</strong>! Pick a mystery to solve.</p></div><div class="case-grid">`;
  G.allCases.forEach((c,i)=>{
    var col=cefrC[c.cefr]||cefrC['B1'];
    var solved=endings.filter(e=>e.case===c.name);
    html+=`<div class="case-card${solved.length?' solved':''}" onclick="startCase(${i})">

      <div class="ctitle">${esc(c.name)}</div>
      <span class="clevel" style="background:${col.bg};color:${col.fg};border:1.5px solid ${col.bd}">${esc(c.cefr)}</span>
      ${solved.length?`<div class="csolve">✓ ${solved.length} ending${solved.length>1?'s':''} found</div>`:''}
    </div>`;

// ── GAME ENGINE ───────────────────────────
function startCase(idx){
  G.currentCase=G.allCases[idx];
  G.nearlyCount=0;G.funnyCount=0;G.badChoices=[];G.history=[];
  ge('mainWrap').innerHTML=`<div class="card" id="gameCard">
    <div id="gameWrap">
      <div class="path-bar">
        <span class="pbadge pb-good" id="pathBadge">🟢 Good path</span>
        <span class="pgcount" id="pgCount">Page 1</span>
      </div>
      <div class="pb-wrap"><div class="pb-fill" id="pbFill"></div></div>
      <div class="story-lbl">The story so far…</div>
      <div class="story-box" id="storyBox"></div>
      <div class="fb" id="fbBox"></div>
      <div class="choices" id="choicesBox"></div>
      <div style="text-align:right;margin-top:.2rem">
        <button class="btn btn-ghost" style="font-size:.8rem;padding:.45rem .9rem" onclick="if(confirm('Quit this case?')){showCaseSelect([])}">✕ Quit</button>
      </div>
    </div>
    <div id="endWrap"></div>
  </div>`;
  // Find first good page
  var pages=Object.values(G.currentCase.pages);
  var start=pages.find(p=>p.path_type==='good'&&/good_1/i.test(p.page_id))||pages.find(p=>p.path_type==='good');
  if(!start){toast('⚠️ No starting page found. Check page_id = good_1 exists in your sheet.');return;}
  goToPage(start.page_id);
}

function goToPage(pid){
  var page=G.currentCase.pages[pid];
  if(!page){toast('⚠️ Page "'+pid+'" not found in sheet.');return;}
  G.pageId=pid;G.history.push(pid);
  renderPage(page);
}

function renderPage(page){
  var pt=page.path_type||'good';
  // Path badge
  var badgeMap={good:{cls:'pb-good',txt:'🟢 Good path'},nearly:{cls:'pb-nearly',txt:'🟡 Nearly there…'},bad_funny:{cls:'pb-bad_funny',txt:'😂 Wrong path'},bad_plain:{cls:'pb-bad',txt:'🔴 Wrong path'}};
  var bk=pt.startsWith('bad_funny')?'bad_funny':pt.startsWith('bad')?'bad_plain':pt==='nearly'?'nearly':'good';
  var bm=badgeMap[bk];
  ge('pathBadge').className='pbadge '+bm.cls;ge('pathBadge').textContent=bm.txt;
  ge('pgCount').textContent='Page '+G.history.length;
  ge('pbFill').style.width=Math.min(100,(G.history.length/8)*100)+'%';
  ge('storyBox').innerHTML=esc(page.story_text||'').replace(/\n/g,'<br>');
  var fb=ge('fbBox');fb.className='fb';fb.textContent='';
  // Is it an ending?
  if(pt.startsWith('ending_')){doEnding(page,pt);return;}
  buildChoices(page,pt);
}

function buildChoices(page,pt){
  var box=ge('choicesBox');box.innerHTML='';
  var choices=[];
  if(pt==='good'){
    var labels=['A','B','C'],ca=page.choice_a||'',cb=page.choice_b||'',cc=page.choice_c||'';
    if(ca)choices.push({txt:ca.replace(/\[.*?\]/g,'').trim(),type:'right'});
    if(cb)choices.push({txt:cb.replace(/\[.*?\]/g,'').trim(),type:'nearly'});
    if(cc)choices.push({txt:cc.replace(/\[.*?\]/g,'').trim(),type:'wrong'});
    choices=shuffle(choices);
  } else if(pt==='nearly'){
    var ca=page.choice_a||'',cb=page.choice_b||'',cc=page.choice_c||'';
    if(ca)choices.push({txt:ca.replace(/\[.*?\]/g,'').trim(),type:'back_on_track'});
    if(cb)choices.push({txt:cb.replace(/\[.*?\]/g,'').trim(),type:'stay_nearly'});
    if(cc)choices.push({txt:cc.replace(/\[.*?\]/g,'').trim(),type:'bad_path'});
    choices=shuffle(choices);
  } else if(pt.startsWith('bad_')){
    var ca=page.choice_a||'',cb=page.choice_b||'';
    if(ca)choices.push({txt:ca.replace(/\[.*?\]/g,'').trim(),type:'funny'});
    if(cb)choices.push({txt:cb.replace(/\[.*?\]/g,'').trim(),type:'plain'});
    choices=shuffle(choices);
  }
  var lbls=['A','B','C'];
  choices.forEach((c,i)=>{
    var btn=document.createElement('button');
    btn.className='cbtn';
    btn.innerHTML=`<span class="clbl">${lbls[i]}</span><span class="ctxt">${esc(c.txt)}</span>`;
    btn.onclick=()=>handleChoice(c,btn,page);
    box.appendChild(btn);
  });
}

function handleChoice(choice,btn,page){
  ge('choicesBox').querySelectorAll('.cbtn').forEach(b=>b.disabled=true);
  var fb=ge('fbBox');
  var pt=page.path_type;
  var num=getNum(page.page_id);

  if(pt==='good'){
    if(choice.type==='right'){
      btn.classList.add('c-ok');
      showFb('ok','✅ <strong>Good detective work!</strong> You\'re on the right track.');
      setTimeout(()=>nextGoodPage(num),1400);
    } else if(choice.type==='nearly'){
      G.nearlyCount++;
      btn.classList.add('c-nearly');
      showFb('nearly','⚠️ <strong>Nearly!</strong> A good instinct, but not quite. You\'re heading down the nearly path.');
      setTimeout(()=>goToNearlyPage(num),1600);
    } else {
      btn.classList.add('c-bad');
      showFb('bad','❌ <strong>Wrong call!</strong> That\'s sent you down the wrong path…');
      setTimeout(()=>goToBadEntry(),1600);
    }
  } else if(pt==='nearly'){
    if(choice.type==='back_on_track'){
      btn.classList.add('c-ok');
      showFb('ok','✅ <strong>Back on track!</strong> Good recovery.');
      setTimeout(()=>nextGoodPage(num),1400);
    } else if(choice.type==='stay_nearly'){
      btn.classList.add('c-nearly');
      showFb('nearly','⚠️ <strong>Hmm.</strong> Still not quite the right call.');
      setTimeout(()=>nextNearlyPage(num),1500);
    } else {
      btn.classList.add('c-bad');
      showFb('bad','❌ <strong>Uh oh!</strong> You\'ve dropped into the bad path.');
      setTimeout(()=>goToBadEntry(),1600);
    }
  } else if(pt.startsWith('bad_')){
    var funny=choice.type==='funny';
    if(funny)G.funnyCount++;
    G.badChoices.push(choice.type);
    btn.classList.add(funny?'c-nearly':'c-bad');
    showFb(funny?'nearly':'bad',funny?'😂 <strong>Ha!</strong> Chaotic, but entertaining…':'😬 <strong>Oh dear.</strong> Things are getting worse.');
    setTimeout(()=>nextBadPage(num),1600);
  }
}

function showFb(type,html){
  var fb=ge('fbBox');
  fb.className='fb fb-'+(type==='ok'?'ok':type==='nearly'?'nearly':'bad')+' show';
  fb.innerHTML=html;
}

function getNum(pid){var m=pid.match(/(\d+)/);return m?parseInt(m[1]):1;}

function nextGoodPage(fromNum){
  var pages=Object.values(G.currentCase.pages).filter(p=>p.path_type==='good').sort((a,b)=>getNum(a.page_id)-getNum(b.page_id));
  var idx=pages.findIndex(p=>p.page_id===G.pageId);
  var next=pages[idx+1];
  if(next)goToPage(next.page_id);else resolveEnding();
}

function goToNearlyPage(num){
  var pid='nearly_'+num;
  if(G.currentCase.pages[pid]){goToPage(pid);return;}
  var p=Object.values(G.currentCase.pages).find(p=>p.path_type==='nearly'&&getNum(p.page_id)===num);
  if(p)goToPage(p.page_id);else nextGoodPage(num);
}

function nextNearlyPage(num){
  var pid='nearly_'+(num+1);
  if(G.currentCase.pages[pid]){goToPage(pid);return;}
  var p=Object.values(G.currentCase.pages).find(p=>p.path_type==='nearly'&&getNum(p.page_id)===num+1);
  if(p)goToPage(p.page_id);else resolveEnding();
}

function goToBadEntry(){
  var p=Object.values(G.currentCase.pages).find(p=>p.path_type==='bad_funny'&&getNum(p.page_id)===1)
    ||Object.values(G.currentCase.pages).find(p=>p.path_type==='bad_plain'&&getNum(p.page_id)===1);
  if(p)goToPage(p.page_id);else resolveEnding();
}

function nextBadPage(num){
  var next=num+1;
  var p=Object.values(G.currentCase.pages).find(p=>p.path_type==='bad_funny'&&getNum(p.page_id)===next)
    ||Object.values(G.currentCase.pages).find(p=>p.path_type==='bad_plain'&&getNum(p.page_id)===next);
  if(p)goToPage(p.page_id);else resolveEnding();
}

function resolveEnding(){
  var eid;
  if(G.badChoices.length===0&&G.nearlyCount===0){eid='ending_good';}
  else if(G.badChoices.length===0&&G.nearlyCount>=3){eid='ending_nearly_funny';}
  else if(G.badChoices.length===0){eid='ending_nearly_good';}
  else if(G.badChoices.length>0&&G.funnyCount>=4){eid='ending_bad_funny';}
  else{eid='ending_bad';}
  var ep=G.currentCase.pages[eid]||Object.values(G.currentCase.pages).find(p=>p.path_type===eid.replace('ending_',''));
  if(ep)goToPage(ep.page_id);else doEnding(null,eid);
}

function doEnding(page,pt){
  var type=pt.replace('ending_','');
  // Save to Redis
  saveEnding(type);
  // Hide game controls
  ge('gameWrap').style.display='none';
  var epMeta={
    good:{icon:'🏆',title:'Case Solved!',cls:'ep-good',badge:'✅ Good Ending',msg:'Outstanding detective work! You made all the right choices and cracked the case perfectly. Scotland Yard would be proud.'},
    nearly_good:{icon:'🥈',title:'Almost Perfect!',cls:'ep-nearly_good',badge:'🟡 Nearly Good Ending',msg:'Well done — you solved the case, though you stumbled once or twice. A solid investigation overall!'},
    nearly_funny:{icon:'🤡',title:'Bumbling But Brilliant!',cls:'ep-nearly_funny',badge:'🟣 Nearly Funny Ending',msg:'You got there in the end — but it was absolute chaos along the way. Three nearly moments and still you cracked it!'},
    bad_funny:{icon:'🎭',title:'Gloriously Chaotic!',cls:'ep-bad_funny',badge:'🎭 Bad Funny Ending',msg:'You went wrong at every turn, but at least you did it with flair. Four hilariously bad choices. The case is unsolved, but the story was entertaining.'},
    bad:{icon:'💀',title:'Case Unsolved.',cls:'ep-bad',badge:'🔴 Bad Ending',msg:'The trail went cold. Poor decisions left the case in tatters. Perhaps Detective Academy is calling…'}
  };
  var m=epMeta[type]||epMeta['good'];
  var ncNote=G.nearlyCount>0?`<div class="nearly-note">⚠️ ${G.nearlyCount} nearly path${G.nearlyCount>1?'s':''} taken</div>`:'';
  var storyExtra=page?.story_text?`<div class="end-story">${esc(page.story_text).replace(/\n/g,'<br>')}</div>`:'';
  ge('endWrap').innerHTML=`
    <span class="end-icon">${m.icon}</span>
    <div class="end-title">${m.title}</div>
    <span class="end-badge ${m.cls}">${m.badge}</span><br/>
    ${ncNote}
    ${storyExtra}
    <div class="end-msg">${m.msg}</div>
    <div class="end-acts">
      <button class="btn btn-navy" onclick="startCase(G.allCases.indexOf(G.currentCase))">🔄 Play Again</button>
      <button class="btn btn-ghost" onclick="showCaseSelect([])">📁 Other Cases</button>
    </div>`;
  ge('endWrap').style.display='block';
  ge('endWrap').scrollIntoView({behavior:'smooth',block:'start'});
}

function saveEnding(type){
  if(!G.redisUrl||!G.redisToken)return;
  var key='nunnas:'+G.studentName.toLowerCase().replace(/\s+/g,'_');
  fetch(G.redisUrl+'/get/'+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+G.redisToken}})
    .then(r=>r.json()).then(d=>{
      var prev=[];try{prev=JSON.parse(d.result)||[];}catch(e){}
      var updated=[...prev,{case:G.currentCase.name,ending:type,date:new Date().toLocaleDateString('en-GB')}];
      fetch(G.redisUrl+'/set/'+encodeURIComponent(key)+'/'+encodeURIComponent(JSON.stringify(updated)),{headers:{'Authorization':'Bearer '+G.redisToken}});
    }).catch(()=>{});
}

function shuffle(arr){var a=[...arr];for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
</script>
